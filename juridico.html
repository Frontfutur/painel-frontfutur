<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jurídico · Painel Frontfutur</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9A%96%EF%B8%8F</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <div id="gateBody">
      <span class="gate-mark">Frontfutur</span>
      <h1>Painel interno</h1>
      <p>Entre com o e-mail e a senha que você recebeu.</p>
    </div>
    <form id="loginForm" novalidate>
      <label for="gEmail">E-mail<input id="gEmail" type="email" autocomplete="username" required></label>
      <label for="gPass">Senha<input id="gPass" type="password" autocomplete="current-password" required></label>
      <button class="btn-primary" type="submit" id="gBtn">Entrar</button>
      <p class="gate-err" id="gErr" hidden></p>
    </form>
  </div>
</div>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <a class="mark" href="index.html">Frontfutur</a>
      <span class="sub">Jurídico</span>
    </div>
    <div class="seg" role="group" aria-label="Visualização">
      <button id="v-lista" aria-pressed="true">Lista geral</button>
      <button id="v-quadro" aria-pressed="false">Quadro</button>
      <button id="v-frentes" aria-pressed="false">Frentes</button>
    </div>
    <button class="who" id="whoBtn">Você: <b id="whoName">—</b></button>
    <button class="btn-primary" id="addBtn">+ Tarefa</button>
  </div>
  <div class="filters">
    <input class="search" id="q" type="search" placeholder="Buscar tarefa, cláusula, pessoa…" aria-label="Buscar">
    <span id="chips" style="display:flex;gap:7px;flex-wrap:wrap"></span>
    <button class="chip" id="onlyBlocked" aria-pressed="false"><span class="dot" style="background:var(--coral)"></span>Só travadas</button>
    <div class="stat-strip">
      <span class="stat" id="statTotal"><b>0</b>tarefas</span>
      <div class="meter" id="meter" title="Distribuição por status"></div>
      <span class="stat" id="statDone"><b>0%</b>concluído</span>
    </div>
  </div>
</header>

<div id="bannerHost"></div>
<main id="view"><div class="loading">Carregando o quadro…</div></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="juridico.js"></script>
</body>
</html>
